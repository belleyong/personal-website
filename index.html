<!DOCTYPE html>
<html lang="en" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>belle 詩帷 — cs grad, hikes, boulders, bakes</title>
<meta name="description" content="personal site of belle 詩帷 — computer science graduate. projects, photos, hobbies and a place to leave me a note.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
/* ============================================================
   1. COLOURS AND THEME
   Change a value here and it updates everywhere on the site.
   ============================================================ */
:root{
  --paper:#f2ece3;   /* page background */
  --card:#fffdf9;    /* window background */
  --ink:#2f2b28;     /* main text + window borders */
  --soft:#7d746a;    /* quieter text */
  --line:#d8cfc6;    /* thin borders */
  --accent:#432033;  /* plum accent */
  --tint:#f5ecf1;    /* pale plum fill */
  --deep:#432033;    /* text on tinted fills */
  --bar:#fffdf9;     /* bottom bar */
  --shadow:rgba(0,0,0,.14);
  --accent-a:rgba(67,32,51,.24);
}
[data-theme="night"]{
  --paper:#1b1418; --card:#241a20; --ink:#f0e1e9; --soft:#b09aa6;
  --line:#4a3641; --accent:#e0bccf; --tint:#33232c; --deep:#f3e2eb;
  --bar:#241a20; --shadow:rgba(0,0,0,.5); --accent-a:rgba(224,188,207,.3);
}

/* ============================================================
   2. RESETS AND SHARED TYPE
   ============================================================ */
*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:'Zen Maru Gothic',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent)}
a:hover{color:var(--deep)}
button{font-family:inherit;cursor:pointer;color:inherit}
input,textarea{font-family:inherit}
.mono{font-family:'Space Mono',monospace}

/* small reusable pieces */
.label{font:700 11px 'Space Mono',monospace;letter-spacing:.16em;color:var(--accent)}
.note{font:400 12px/1.6 'Space Mono',monospace;color:var(--soft)}
.lead{font:400 17px/1.6 'Zen Maru Gothic',sans-serif;color:var(--soft)}
.btn{
  border:2px solid var(--accent); background:var(--tint); color:var(--deep);
  padding:8px 16px; font:500 17px 'Zen Maru Gothic',sans-serif;
  box-shadow:0 3px 0 var(--accent-a);
}
.btn:hover{box-shadow:0 5px 0 var(--accent-a)}
.field{border-left:3px solid var(--accent);padding-left:12px}
.field-val{font:400 17px/1.5 'Zen Maru Gothic',sans-serif;color:var(--ink);margin-top:4px}
.ph{ /* placeholder box — swap these for real images */
  border:2px solid var(--line); background:rgba(127,127,127,.06);
  display:flex; align-items:center; justify-content:center;
  font:400 11px 'Space Mono',monospace; color:var(--soft); text-align:center;
}

/* ============================================================
   3. LANDING SCREEN (the seed you tap)
   ============================================================ */
.landing{
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  position:relative; overflow:hidden; text-align:center; padding:24px;
}
.landing-ground{
  position:absolute; left:0; right:0; bottom:0; height:120px;
  border-top:2px dashed var(--line);
  background:linear-gradient(180deg,var(--accent-a),transparent);
  opacity:.5;
}
.landing-inner{position:relative;z-index:2}
.landing h1{font:900 clamp(2.6rem,7vw,4.4rem)/1 'Zen Maru Gothic',sans-serif;margin:14px 0 10px}
.landing p{font:400 clamp(1rem,2vw,1.25rem)/1.5 'Zen Maru Gothic',sans-serif;color:var(--soft);margin:0 auto 30px;max-width:30ch}
.seed{
  width:132px; height:132px; border-radius:50%; border:2px solid var(--accent);
  background:var(--tint); color:var(--deep);
  font:700 17px 'Zen Maru Gothic',sans-serif;
  box-shadow:0 6px 0 var(--accent-a); animation:bob 2.6s infinite;
}
.seed:hover{box-shadow:0 9px 2px var(--accent-a);animation:sprout .5s}

/* ============================================================
   4. THE OUTER WINDOW FRAME
   ============================================================ */
.frame-wrap{
  min-height:100vh; padding:clamp(14px,2.4vw,34px);
  display:flex; align-items:center; justify-content:center;
}
.frame{
  flex:1; display:flex; flex-direction:column; margin:0 auto;
  background:var(--card); border:2px solid var(--ink);
  box-shadow:0 6px 0 var(--shadow);
  position:relative; overflow:hidden;
  min-height:600px; max-width:940px; max-height:min(780px,calc(100vh - 68px));
}
.titlebar{
  flex:none; display:flex; align-items:center; justify-content:space-between;
  gap:10px; flex-wrap:wrap; padding:9px 14px;
  background:var(--ink); color:var(--paper);
  font:400 15px 'Space Mono',monospace;
}
.dots{display:flex;align-items:center;gap:9px}
.dot{width:9px;height:9px;border-radius:50%;background:currentColor;opacity:.55}
.tb-btns{display:flex;align-items:center;gap:7px}
.tb-btn{
  border:1px solid rgba(255,255,255,.4); background:transparent;
  border-radius:4px; padding:2px 9px; font:400 12px 'Space Mono',monospace;
}
.tb-btn:hover{background:rgba(255,255,255,.12)}

/* the desk area windows sit on */
.desk{
  flex:1; position:relative; min-height:0;
  display:flex; align-items:center; justify-content:center;
  padding:clamp(18px,3vh,40px); overflow:hidden;
}
.waves{position:absolute;left:0;right:0;bottom:0;height:130px;overflow:hidden;pointer-events:none}
.wave-1{position:absolute;left:0;bottom:0;width:200%;height:110px;animation:swell 14s ease-in-out infinite alternate}
.wave-2{position:absolute;left:-50%;bottom:0;width:200%;height:84px;animation:swell 9s ease-in-out infinite alternate-reverse}

/* night extras */
.night-layer{position:absolute;inset:0;pointer-events:none}
.moon{
  position:absolute; right:46px; top:26px; width:52px; height:52px;
  border-radius:50%; background:rgba(240,225,235,.12);
  border:1px solid rgba(240,225,235,.38);
}
.firefly{
  position:absolute; border-radius:50%; background:#f2d59a;
  box-shadow:0 0 12px #f2d59a;
}

/* ============================================================
   5. HOME WINDOW (hero + icon row)
   ============================================================ */
.home-win{
  width:100%; max-width:clamp(40rem,54vw,44rem);
  background:var(--card); border:2px solid var(--ink);
  box-shadow:0 5px 0 var(--shadow); position:relative; z-index:1;
}
.win-head{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:6px 11px; background:var(--ink); color:var(--paper);
  font:400 13px 'Space Mono',monospace;
}
.win-head .dots{gap:8px}
.win-head .dot{width:8px;height:8px}
.home-body{padding:26px 28px 24px;text-align:center}
.home-body h1{font:900 clamp(2.1rem,4.4vw,3.3rem)/1 'Zen Maru Gothic',sans-serif;margin:0}
.home-body .sub{font:400 clamp(1rem,1.6vw,1.2rem)/1.5 'Zen Maru Gothic',sans-serif;color:var(--soft);margin:9px 0 4px}
.bloom-line{font:400 12px 'Space Mono',monospace;letter-spacing:.12em;color:var(--accent);margin-bottom:22px}
.icon-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:18px 12px;justify-items:center}
.icon-btn{
  border:none; background:transparent; padding:0;
  display:flex; flex-direction:column; align-items:center; gap:6px;
  transition:transform .18s cubic-bezier(0,0,.2,1);
}
.icon-btn:hover{transform:translateY(-3px)}
.tile{
  width:48px; height:48px; border-radius:11px;
  border:2px solid var(--ink); background:var(--tint);
  display:flex; align-items:center; justify-content:center;
  font:700 15px 'Space Mono',monospace; color:var(--deep);
  box-shadow:0 5px 0 var(--shadow);
}
.icon-btn.bloomed .tile{border-color:var(--accent)}
.icon-label{font:500 16px 'Zen Maru Gothic',sans-serif;color:var(--ink)}

/* ============================================================
   6. MOTIVATIONAL POP-UP
   ============================================================ */
.popup{
  position:absolute; left:50%; top:14px; transform:translateX(-50%);
  width:min(320px,86%); z-index:99;
  border:2px solid var(--accent); background:var(--tint);
  box-shadow:0 4px 0 var(--accent-a); padding:11px 15px; text-align:center;
  animation:popin .3s ease-out;
}
.popup-text{font:700 clamp(1.15rem,2vw,1.45rem)/1.15 'Zen Maru Gothic',sans-serif;color:var(--deep)}
.popup-track{margin-top:9px;height:4px;background:var(--accent-a);border-radius:2px;overflow:hidden}
.popup-bar{height:4px;background:var(--accent);width:100%;transform-origin:left}

/* ============================================================
   7. SECTION WINDOWS (draggable)
   ============================================================ */
.win{
  position:absolute; background:var(--card); border:2px solid var(--ink);
  box-shadow:0 6px 0 var(--shadow); animation:winin .25s ease-out;
}
.win-head.grab{cursor:grab}
.win-close{border:none;background:transparent;font:400 15px 'Space Mono',monospace;padding:0 2px}
.win-body{padding:20px 22px;overflow:auto;max-height:min(58vh,460px)}
.row{display:flex;gap:22px;flex-wrap:wrap}

/* about */
.avatar{width:140px;height:140px;border-radius:50%}
.about-text{flex:1;min-width:240px}
.about-text h2{font:700 clamp(1.5rem,2.6vw,2rem)/1.15 'Zen Maru Gothic',sans-serif;margin:0 0 8px}
.stack{display:flex;flex-direction:column;gap:14px}

/* projects */
.proj-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.proj-card{
  border:2px solid var(--line); background:var(--card);
  box-shadow:0 4px 0 var(--shadow); padding:12px; min-height:136px;
  transition:all .18s cubic-bezier(0,0,.2,1); text-align:left;
}
.proj-card.linked{cursor:pointer}
.proj-card:hover{border-color:var(--accent);background:var(--tint);box-shadow:0 6px 0 var(--accent-a)}
.thumb{height:74px}
.thumb.real{background:#3f7f92 center 62% / cover no-repeat;border:0}
.proj-name{font:500 18px 'Zen Maru Gothic',sans-serif;color:var(--ink);margin-top:8px}
.proj-face{display:block}
.proj-back{display:none}
.proj-card:hover .proj-face{display:none}
.proj-card:hover .proj-back{display:block}
.proj-back .proj-title{font:700 18px/1.2 'Zen Maru Gothic',sans-serif;color:var(--deep)}
.proj-back .proj-meta{font:400 11px/1.6 'Space Mono',monospace;color:var(--accent);margin-top:4px}
.proj-back .proj-desc{font:400 14px/1.4 'Zen Maru Gothic',sans-serif;color:var(--ink);margin-top:6px}
.proj-back .proj-cta{font:500 13px 'Space Mono',monospace;color:var(--accent);margin-top:6px}

/* gallery */
.sheet{
  border:2px solid var(--ink); background:rgba(127,127,127,.06); padding:10px;
  display:grid; grid-template-columns:repeat(4,1fr); gap:10px;
}
.frame-btn{height:96px;padding:0}
.frame-btn:hover{border-color:var(--accent)}
.lightbox-img{height:320px}
.lightbox-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.btn-quiet{border:2px solid var(--line);background:var(--card);padding:5px 12px;font:500 16px 'Zen Maru Gothic',sans-serif;color:var(--ink)}

/* hobbies */
.hobby-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.hobby-card{
  border:2px solid var(--line); background:var(--card);
  box-shadow:0 4px 0 var(--shadow); padding:10px; text-align:left;
  display:flex; flex-direction:column; gap:7px;
  transition:all .18s cubic-bezier(0,0,.2,1);
}
.hobby-card.on{border-color:var(--accent);background:var(--tint);box-shadow:0 5px 0 var(--accent-a)}
.hobby-icon{height:48px;background:var(--accent-a);display:flex;align-items:center;justify-content:center;font:400 11px 'Space Mono',monospace;color:var(--soft)}
.hobby-name{font:500 17px 'Zen Maru Gothic',sans-serif;color:var(--ink)}

/* life log */
.log{display:flex;flex-direction:column;gap:16px}
.log-entry{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.log-entry+.log-entry{border-top:2px dashed var(--line);padding-top:16px}
.log-photo{width:170px;height:116px;flex:none}
.log-text{flex:1;min-width:200px}
.log-date{font:400 12px 'Space Mono',monospace;color:var(--accent)}
.log-caption{font:400 19px/1.45 'Zen Maru Gothic',sans-serif;color:var(--ink);margin-top:3px}

/* faq */
.faq-list{display:flex;flex-direction:column;gap:10px}
.faq-item{border:2px solid var(--line);background:var(--card);padding:10px 13px}
.faq-item.on{border-color:var(--accent);background:var(--tint)}
.faq-q{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;border:none;background:transparent;padding:0;text-align:left}
.faq-q span:first-child{font:500 19px 'Zen Maru Gothic',sans-serif;color:var(--ink)}
.chev{font:400 13px 'Space Mono',monospace;color:var(--accent);transition:transform .2s}
.faq-item.on .chev{transform:rotate(180deg)}
.faq-a{font:400 17px/1.55 'Zen Maru Gothic',sans-serif;color:var(--deep);margin-top:7px}

/* note / guestbook */
.plant-col{flex:none;width:230px}
.plant{position:relative;height:220px;border:2px solid var(--accent);background:var(--tint)}
.stem{position:absolute;left:50%;bottom:14px;width:3px;height:120px;background:var(--accent);transform:translateX(-50%);opacity:.55}
.bloom{position:absolute;width:14px;height:14px;border-radius:60% 40% 60% 40%;background:var(--accent);opacity:.8}
.plant-empty{position:absolute;left:0;right:0;bottom:16px;text-align:center;font:400 13px 'Space Mono',monospace;color:var(--soft)}
.bloom-count{font:400 12px 'Space Mono',monospace;color:var(--accent);text-align:center;margin-top:8px;letter-spacing:.1em}
.note-col{flex:1;min-width:260px}
.note-col h2{font:700 clamp(1.25rem,2.2vw,1.65rem)/1.3 'Zen Maru Gothic',sans-serif;margin:0 0 12px}
.ta{
  width:100%; min-height:92px; border:2px solid var(--line);
  background:var(--card); color:var(--ink); padding:9px 11px;
  font:400 17px/1.45 'Zen Maru Gothic',sans-serif; resize:vertical;
}
.note-row{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;align-items:center}
.in{
  flex:1; min-width:170px; border:2px solid var(--line);
  background:var(--card); color:var(--ink); padding:8px 11px;
  font:400 16px 'Zen Maru Gothic',sans-serif;
}

/* contact + cv */
.centered{text-align:center}
.centered h2{font:700 clamp(1.6rem,3vw,2.2rem)/1.1 'Zen Maru Gothic',sans-serif;margin:0 0 8px}
.mail-btn{display:inline-block;font:500 19px 'Zen Maru Gothic',sans-serif;text-decoration:none}
.socials{display:flex;gap:16px;justify-content:center;margin-top:20px;flex-wrap:wrap;font:400 15px 'Space Mono',monospace}

/* ============================================================
   8. BOTTOM BAR (orchid + mood)
   ============================================================ */
.bottombar{
  flex:none; display:flex; align-items:center; justify-content:space-between;
  gap:12px; flex-wrap:wrap; padding:8px 14px;
  border-top:2px solid var(--ink); background:var(--bar);
}
.orchid-btn{display:flex;align-items:center;gap:10px;border:none;background:transparent;padding:0;text-align:left}
.orchid{
  width:30px; height:38px; border:2px solid var(--accent); border-radius:5px;
  background:var(--tint); display:flex; align-items:center; justify-content:center;
  font:700 9px 'Space Mono',monospace; color:var(--deep); animation:bob 2.4s infinite;
}
.orchid-line{font:400 15px 'Zen Maru Gothic',sans-serif;color:var(--soft)}
.mood{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mood-faces{display:flex;align-items:center;gap:8px}
.mood-btn{
  width:34px; height:34px; border-radius:50%;
  border:2px solid var(--line); background:transparent; color:var(--soft);
  font:700 12px 'Space Mono',monospace;
  display:flex; align-items:center; justify-content:center;
  transition:all .18s cubic-bezier(0,0,.2,1);
}
.mood-btn.on{border-color:var(--accent);background:var(--accent);color:var(--card)}

/* ============================================================
   9. ANIMATIONS
   ============================================================ */
@keyframes bob{0%,100%{transform:translateY(4px)}50%{transform:translateY(-2px)}}
@keyframes sprout{0%{transform:scale(1)}45%{transform:scale(1.16) rotate(-3deg)}100%{transform:scale(1)}}
@keyframes petal{0%{opacity:.9;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx,8px),26px) scale(.4)}}
@keyframes fly{0%{transform:translate(0,0)}25%{transform:translate(26px,-18px)}50%{transform:translate(48px,10px)}75%{transform:translate(18px,22px)}100%{transform:translate(0,0)}}
@keyframes glow{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes popin{0%{opacity:0;transform:translate(-50%,-10px) scale(.94)}100%{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes bloomin{0%{opacity:0;transform:scale(.2)}70%{transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
@keyframes winin{0%{opacity:0;transform:scale(.97) translateY(6px)}100%{opacity:1;transform:scale(1) translateY(0)}}
@keyframes shrinkbar{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@keyframes swell{from{transform:translateX(0)}to{transform:translateX(-18%)}}

/* ============================================================
   10. PHONE LAYOUT — the frame disappears, everything stacks
   ============================================================ */
@media (max-width:767px){
  .frame-wrap{padding:0}
  .frame{max-width:none;max-height:none;border:0;box-shadow:none}
  .desk{padding:14px}
  .home-win{max-width:100%}
  .icon-grid{grid-template-columns:repeat(2,1fr)}
  .proj-grid{grid-template-columns:1fr}
  .sheet{grid-template-columns:1fr 1fr}
  .hobby-grid{grid-template-columns:1fr 1fr}
  .plant-col{width:100%}
  .win{inset:0 !important;width:auto !important;display:flex;flex-direction:column;box-shadow:none}
  .win-body{max-height:none;flex:1}
  .win-head.grab{cursor:default}
  /* hover-to-flip does not exist on touch, so show the details */
  .proj-face{display:none}
  .proj-back{display:block}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
}
</style>
</head>

/* ---- saving to the visitor's own browser ---- */
function save(){
  try{
    localStorage.setItem("belle.state", JSON.stringify({
      theme:state.theme, lang:state.lang, sfx:state.sfx, watered:state.watered,
      notes:state.notes, blooms:state.blooms, entered:state.entered, dayMood:state.dayMood
    }));
  }catch(e){}
}
function load(){
  try{
    const v = JSON.parse(localStorage.getItem("belle.state") || "null");
    if(!v) return;
    state.theme = v.theme === "night" ? "night" : "day";
    state.lang = v.lang === "zh" ? "zh" : "en";
    state.sfx = v.sfx !== false;
    state.watered = v.watered || 0;
    state.notes = v.notes || 0;
    state.entered = !!v.entered;
    state.blooms = (v.blooms || []).filter(id => SECTIONS.some(x => x.id === id));
    state.dayMood = FACES.some(f => f.id === v.dayMood) ? v.dayMood : null;
  }catch(e){}
}

/* ---- sound ---- */
let audioCtx = null;
function ac(){
  if(!audioCtx){ try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ audioCtx = null; } }
  if(audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
function blip(freq, dur, type, gain){
  if(!state.sfx) return;
  const c = ac(); if(!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || "triangle"; o.frequency.value = freq;
  g.gain.setValueAtTime(0, c.currentTime);
  g.gain.linearRampToValueAtTime(gain || .07, c.currentTime + .012);
  g.gain.exponentialRampToValueAtTime(.0001, c.currentTime + (dur || .16));
  o.connect(g); g.connect(c.destination);
  o.start(); o.stop(c.currentTime + (dur || .16) + .02);
}
const clickSound = () => blip(660, .13);
const popSound = () => blip(1040, .07, "sine", .045);
function chime(){ blip(784, .18); setTimeout(() => blip(1175, .22), 90); }

/* background music — four little loops, cycled by the ▶ button */
let moodTimer = null;
function cycleMood(){
  clickSound();
  state.mood = (state.mood + 1) % 4;
  if(moodTimer){ clearInterval(moodTimer); moodTimer = null; }
  render();
  if(state.mood === 0) return;
  const scales = [[392,440,523,587],[349,415,466,523],[440,494,587,659]];
  const notes = scales[state.mood - 1];
  let i = 0;
  const play = () => {
    if(!state.sfx) return;
    const c = ac(); if(!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = "sine"; o.frequency.value = notes[i++ % notes.length];
    g.gain.setValueAtTime(0, c.currentTime);
    g.gain.linearRampToValueAtTime(.03, c.currentTime + .3);
    g.gain.exponentialRampToValueAtTime(.0001, c.currentTime + 2.4);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime + 2.5);
  };
  play();
  moodTimer = setInterval(play, 2000);
}

/* ---- pop-ups ---- */
let popTimer = null;
function showPopup(msg){
  state.popup = msg || MSGS[Math.floor(Math.random() * MSGS.length)];
  render();
  if(popTimer) clearTimeout(popTimer);
  popTimer = setTimeout(() => { state.popup = null; render(); }, POPUP_SECONDS * 1000);
}

/* ---- petal trail on the cursor ---- */
let lastPetal = 0;
function petal(e){
  if(isMobile() || !state.entered) return;
  const now = Date.now();
  if(now - lastPetal < 90) return;
  lastPetal = now;
  const d = document.createElement("div");
  const size = 5 + Math.random() * 5;
  d.style.cssText = "position:fixed;left:" + (e.clientX - size/2) + "px;top:" + (e.clientY - size/2) +
    "px;width:" + size + "px;height:" + size + "px;border-radius:60% 40% 60% 40%;background:var(--accent);opacity:.45;" +
    "pointer-events:none;z-index:9999;--dx:" + ((Math.random()*24)-12) + "px;animation:petal .9s ease-out forwards";
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 950);
}

        wavesView() + nightView() + homeView() + popupView() +
        state.open.map(id => winView(SECTIONS.find(s => s.id === id))).join("") +
      '</div>' +
      bottombarView() +
    '</div>' +
  '</div>';
}


/* ============================================================
   ACTIONS — what each click does
   ============================================================ */
const actions = {
  enter(){
    chime();
    state.entered = true;
    state.watered++;
    save();
    showPopup();
  },
  open(el){
    const id = el.dataset.id;
    clickSound();
    state.open = state.open.filter(x => x !== id).concat([id]);
    if(state.blooms.indexOf(id) === -1) state.blooms.push(id);
    save(); render();
  },
  close(el){
    blip(440, .12);
    state.open = state.open.filter(x => x !== el.dataset.id);
    render();
  },
  sfx(){
    state.sfx = !state.sfx;
    save(); render();
    if(state.sfx) popSound();
  },
  theme(){ clickSound(); state.theme = state.theme === "day" ? "night" : "day"; save(); render(); },
  lang(){ clickSound(); state.lang = state.lang === "en" ? "zh" : "en"; save(); render(); },
  mood(){ cycleMood(); },
  water(){ popSound(); state.watered++; save(); render(); },
  proj(el){
    const i = +el.dataset.i;
    pinProject(i);
    const p = PROJECTS[i];
    if(!p.link) return;
    clickSound();
    window.open(p.link, "_blank", "noopener");
  },
  hobby(el){
    clickSound();
    state.hobby = state.hobby === el.dataset.id ? null : el.dataset.id;
    render();
  },
  faq(el){
    clickSound();
    const i = +el.dataset.i;
    state.faq = state.faq === i ? null : i;
    render();
  },
  lightbox(el){ popSound(); state.lightbox = +el.dataset.i; render(); },
  "lightbox-close"(){ clickSound(); state.lightbox = null; render(); },
  "note-send"(){
    const ta = document.getElementById("note-msg");
    if(!ta || !ta.value.trim()) return;
    /* Right now the note only blooms in the visitor's own browser.
       To actually receive it, sign up for a free form service
       (Formspree, Netlify Forms, Google Forms) and post the values here. */
    chime();
    state.notes++;
    state.noteSent = true;
    state.noteMsg = "";
    state.noteIg = "";
    save(); render();
  },
  "note-reset"(){ clickSound(); state.noteSent = false; render(); },
  day(el){
    popSound();
    const id = el.dataset.id;
    const same = state.dayMood === id;
    state.dayMood = same ? null : id;
    save();
    if(same){ state.popup = null; render(); }
    else showPopup(id === "good" ? "yayy! i'm so glad :0" : id === "ok" ? "okay is good too :)" : "pat pat you got this ;>");
  }
};

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if(!el) return;
  const fn = actions[el.dataset.act];
  if(fn) fn(el);
});

/* keep what a visitor typed if the window re-renders */
document.addEventListener("input", (e) => {
  if(e.target.id === "note-msg") state.noteMsg = e.target.value;
  if(e.target.id === "note-ig") state.noteIg = e.target.value;
});

/* swap the detail panel without redrawing the whole window, so the
   card you are hovering does not flicker */
function pinProject(i){
  if(state.pinnedProj === i) return;
  state.pinnedProj = i;
  const slot = document.getElementById("proj-pinned");
  if(slot) slot.innerHTML = pinnedHTML();
}

/* pop sound when hovering the things that should feel clicky */
document.addEventListener("mouseover", (e) => {
  const card = e.target.closest(".proj-card");
  if(card) pinProject(+card.dataset.i);
  if(e.target.closest(".icon-btn, .proj-card, .frame-btn")) popSound();
});

/* ---- dragging the windows ---- */
let drag = null;
document.addEventListener("mousedown", (e) => {
  const head = e.target.closest("[data-drag]");
  if(!head || isMobile() || e.target.closest(".win-close")) return;
  const id = head.dataset.drag;
  const p = state.pos[id] || defaultPos(id);
  drag = {id, sx:e.clientX, sy:e.clientY, ox:p.x, oy:p.y, el:document.getElementById("win-" + id)};
  e.preventDefault();
});
document.addEventListener("mousemove", (e) => {
  if(drag){
    const x = drag.ox + e.clientX - drag.sx;
    const y = drag.oy + e.clientY - drag.sy;
    state.pos[drag.id] = {x, y};
    if(drag.el){ drag.el.style.left = x + "px"; drag.el.style.top = y + "px"; }
  }
  petal(e);
});
document.addEventListener("mouseup", () => { drag = null; });

let lastMobile = isMobile();
window.addEventListener("resize", () => {
  if(isMobile() !== lastMobile){ lastMobile = isMobile(); render(); }
});

load();
render();
</script>
</body>
</html>
